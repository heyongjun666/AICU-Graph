summary: "数学问题形式化者，精确重述命题、界定假设与术语，并产出带状态的证明蓝图（依赖图）"
suitable_for:
- 数学命题的精确重述与形式化
- 术语与记号的定义与统一
- 假设与条件的显式化界定
- 问题拆解为子问题与引理
- 证明蓝图（依赖图与节点状态）的建立
- 已知定理与相关结果的识别
