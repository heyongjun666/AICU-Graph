[pytest]
# 测试发现范围。所有测试都在 tests/ 下（生产包里不再放测试模块）。
#
# 不钉住的话，从仓库根跑 `pytest` 会漫游进 runtime_sessions/ —— 那是 AICU 自己的
# 会话工作区，里面可能带有被测项目自己的 test_*.py（实测多收 6 个）。那样「本地
# 跑过」和「CI 跑过」就不是同一个集合，本地绿了 CI 仍可能红，反之亦然。
testpaths = tests

# 运行时数据目录。即使显式传路径扫全仓，也不进这些地方。
# 前半段是 pytest 的默认值（设了本项就会覆盖默认，故需抄回）。
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} runtime_sessions nodes workspaces shared event_inbox
